format: ageval.profiles/1
environment: docker

# dsh is a single coding-agent harness: bind every role slot (solver,
# user+service, specialist+planner+reducer) via the "*" wildcard row.
agent_profiles:
  '*':
    executor: dsh
    extensions:
    - plugin: dsh
      options:
        composition: slim
    - plugin: docker
    model:
      id: dashscope/deepseek-v4-flash
      reasoning:
        effort: max
    api_key: ${litellm_api_key}
    base_url: ${litellm_base_url}
