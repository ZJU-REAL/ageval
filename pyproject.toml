[project]
name = "ageval-cli"
dynamic = ["version"]
description = "ageval — agent evaluation runtime (Attempt pipeline + environment kinds)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ZJU-REAL" }]
dependencies = [
    "pyyaml>=6.0.2",
    "typer>=0.16.0",
    "agent-client-protocol==0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
    "pyright>=1.1.400",
]
# Self-hosted Hub / Registry *service* (services/registry). Not used by the CLI client.
registry = [
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
]
nooa = [
    "httpx[socks]>=0.28.1",
    "nooa>=0.0.7",
    "socksio>=1.0.0",
]
dsh = [
    "deepseek-harness-sdk==0.1.0rc6",
]
miniswe = [
    "mini-swe-agent>=2.0",
    "socksio>=1.0.0",
]
e2b = [
    "e2b>=2.25.0",
]
daytona = [
    "daytona>=0.21.0",
    "socksio>=1.0.0",
]
all = [
    "ageval-cli[nooa]",
    "ageval-cli[dsh]",
    "ageval-cli[miniswe]",
    "ageval-cli[e2b]",
    "ageval-cli[daytona]",
]

[project.scripts]
ageval = "ageval.cli.main:app"
ae = "ageval.cli.main:app"

[project.urls]
Homepage = "https://github.com/ZJU-REAL/ageval"
Repository = "https://github.com/ZJU-REAL/ageval"
Issues = "https://github.com/ZJU-REAL/ageval/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

# Viewer SPA enters the wheel at release build: apps/viewer `pnpm build` →
# copy dist/ to src/ageval/viewer/static/ (gitignored) → `uv build`.
# The sdist force-include keeps sdist→wheel rebuilds SPA-carrying; building an
# sdist without apps/viewer/dist fails on purpose (never ship a SPA-less sdist).
[tool.hatch.build.targets.wheel]
packages = ["src/ageval", "src/ageval_sdk"]
# artifacts overrides .gitignore for the release-copied SPA (no-op while absent).
artifacts = ["src/ageval/viewer/static/**"]

[tool.hatch.build.targets.sdist]
force-include = { "apps/viewer/dist" = "src/ageval/viewer/static" }

[tool.uv]
package = true
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
    "pyright>=1.1.400",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "plugins", "services", "scripts"]
extend-exclude = ["docs", "specs", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "SIM105", "T201", "BLE001", "S110", "TRY"]

[tool.ruff.format]
quote-style = "double"


# Stock as of 2026-10-17. Do not add files or rules.
# cli/, scripts/, and tests/ may print. Other T201 and TRY message
# nits stay listed until that file is cleaned. BLE001, S110, and
# SIM105 have no ignore: a swallow fails the check.
[tool.ruff.lint.per-file-ignores]
"src/ageval/cli/**" = ["T201"]
"scripts/**" = ["T201"]
"tests/**" = ["T201"]
"plugins/acp-oneshot/src/acp_oneshot_plugin/factory.py" = ["TRY003"]
