# Automatic PR review via Claude Code Action, backed by GLM Coding Plan
# (Anthropic-compatible endpoint). Secrets live under:
#   Settings → Secrets and variables → Actions
# Not under "Agents" (that is for Copilot cloud agent only).
name: Claude Code Review (GLM)

on:
  pull_request:
    branches: [main, canary, dev]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    env:
      # GLM Coding Plan — Anthropic-compatible gateway (matches local Claude Code).
      # Override via repo secret if you use the international endpoint (api.z.ai).
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://open.bigmodel.cn/api/anthropic' }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
      API_TIMEOUT_MS: "3000000"
      # Optional model map for GLM Coding Plan (server may remap Claude names → GLM).
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL || 'glm-5.3' }}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL || 'glm-5.3' }}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL || 'glm-5.3' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a PR for **BORA** (Bounded Orchestration for Runtime Agents).
            Read `AGENTS.md` and, if touched, relevant `docs/design/*`, `ARCHITECTURE.md`,
            and linked GitHub Issues before commenting.

            **Static review only — do NOT run CI locally.**
            - Do not run `uv`, `pytest`, `ruff`, `pyright`, `pnpm`, or any install/build/test commands.
            - Do not apologize for sandbox limits or ask the author to "confirm CI is green" because you could not run tests.
            - GitHub Actions path-filtered jobs (`python-core`, `python-registry`, `viewer-app`, `hub-app`, `website`) own the gate; you may mention which jobs should cover the diff, but never attempt to execute them.
            - Judge test coverage by reading the diff and existing tests only.

            Focus on:
            1. **Correctness / regressions** — lifecycle, provider isolation, capability authority, evaluation barriers
            2. **Architecture boundaries** — Core vs Harness ownership; no leaking private ACP scrape; no runtime authority in SDK
            3. **Security** — secrets must not appear in trajectories, locks, logs, or fixtures; redaction paths; mount/visibility projections
            4. **Evidence honesty** — do not invent runnable-mvp / isolated / real-benchmark claims from docs alone
            5. **Tests (read-only)** — whether the diff adds/updates offline pytest coverage for behavior changes; flag gaps without running tests; avoid requiring Docker L1/e2e unless PR already owns that surface
            6. **Scope** — small, focused diffs; no unrelated refactors

            Output language: English by default (summary and inline comments). Match the PR author's language only if the PR description/title is clearly non-English.

            **What counts as a blocker** (must be fixed before merge):
            - Correctness / regression risk, architecture-boundary violation, security/secret leak,
              evidence-grade inflation, missing offline tests for new behavior you judge required,
              or other fail-closed / product-invariant breaks.
            - Style nits, renames, dead-code cleanup, optional docs polish, “worth noting” trust
              boundaries that are by-design, and speculative future footguns are **not** blockers.

            **Posting policy (strict — follow exactly):**

            1. First decide: are there **any blockers**?
            2. **No blockers** → post **exactly one** top-level `gh pr comment`. Open with a short
               approve-ready sentence (optional: which path-filtered CI jobs should cover the diff).
               Then add **2–3 sentences** that cover:
               - work quality (focused / sloppy / over-scoped — be specific, not generic praise)
               - the core change (what actually moved, not a file list)
               - issue alignment: if the PR / commits / description link an Issue, say whether the
                 diff matches that Issue's owned surface; if none is linked, say so in one clause
               Example shape:
               `No blockers — approve-ready. Path-filtered: python-core.`
               `Solid, tightly scoped. Core change is X (the mechanism that moved). Aligns with #N's
               acceptance; does not expand into Y.`
               Do **not** post inline comments. Do **not** list nits, checklists, “what's solid”
               sections, or multi-section essays. Keep the whole comment to those 3–4 sentences.
            3. **Has blockers** → one concise top-level `gh pr comment`: first the same 2–3 sentence
               quality / core-change / issue-alignment brief, then a **blockers-only** bullet list.
               Use `mcp__github_inline_comment__create_inline_comment` **only** for those blocker
               lines. Do **not** add nits / polish / non-blocking asides in summary or inline.
            4. Only post GitHub review comments — do not dump the review as assistant chat text.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
