# Path-filtered parallel CI:
#   python-core     — ruff / pyright / offline pytest (excludes tests/registry)
#   python-registry — offline pytest tests/registry only
#   viewer-app / hub-app — pnpm lint + build
#   website         — pnpm build
#   design-tokens   — web UI token machine-check (docs/design/13)
#
# Jobs always start (required-check friendly) and no-op when their path filter
# is false. Workflow edits re-run every job. No Docker L1 / real Agent e2e.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# paths-filter lists PR files via GitHub API on pull_request events.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      viewer_app: ${{ steps.filter.outputs.viewer_app }}
      hub_app: ${{ steps.filter.outputs.hub_app }}
      website: ${{ steps.filter.outputs.website }}
      design_tokens: ${{ steps.filter.outputs.design_tokens }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect path groups
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'sdk/**'
              - 'tests/**'
              - 'examples/**'
              - 'services/**'
              - 'docker/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'VERSION'
              - '.python-version'
            viewer_app:
              - 'apps/viewer/**'
            hub_app:
              - 'apps/hub/**'
            website:
              - 'website/**'
            design_tokens:
              - 'website/**'
              - 'apps/**'
              - 'docs/design/13-web-ui-tokens.md'
              - 'scripts/check_design_tokens.py'
            workflow:
              - '.github/workflows/ci.yml'

  python-core:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip (no Python-relevant paths)
        if: needs.changes.outputs.python != 'true' && needs.changes.outputs.workflow != 'true'
        run: |
          echo "Skipping python-core (SPA/docs-only or unrelated paths)."

      - name: Checkout
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        uses: actions/checkout@v4

      - name: Install uv
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        run: uv python install 3.12

      - name: Install dependencies (frozen)
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        run: uv sync --frozen

      - name: Ruff format
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        run: uv run ruff format --check src tests

      - name: Ruff check
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        run: uv run ruff check src tests

      - name: Pyright
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        run: uv run pyright

      - name: Builtin plugin catalog
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        run: uv run python scripts/check_builtin_plugins.py

      # Offline core: no Docker L1, no real agent CLIs, no registry suite.
      - name: Pytest (core, exclude registry)
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        env:
          AGEVAL_OFFLINE_AGENT: "1"
          AGEVAL_SKIP_DOCKER: "1"
          AGEVAL_SKIP_REAL_CODEX: "1"
          AGEVAL_SKIP_REAL_PI: "1"
          AGEVAL_SKIP_REAL_OPENCODE: "1"
          AGEVAL_SKIP_REAL_ACP: "1"
        run: |
          uv run pytest \
            --ignore=tests/registry \
            -q

  python-registry:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip (no Python-relevant paths)
        if: needs.changes.outputs.python != 'true' && needs.changes.outputs.workflow != 'true'
        run: |
          echo "Skipping python-registry (SPA/docs-only or unrelated paths)."

      - name: Checkout
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        uses: actions/checkout@v4

      - name: Install uv
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        run: uv python install 3.12

      - name: Install dependencies (frozen)
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        run: uv sync --frozen --extra registry

      - name: Pytest (registry)
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
        env:
          AGEVAL_OFFLINE_AGENT: "1"
          AGEVAL_SKIP_DOCKER: "1"
        run: uv run pytest tests/registry -q

  viewer-app:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/viewer
    steps:
      - name: Skip (no apps/viewer paths)
        if: needs.changes.outputs.viewer_app != 'true' && needs.changes.outputs.workflow != 'true'
        run: echo "Skipping viewer-app."
        working-directory: .

      - name: Checkout
        if: needs.changes.outputs.viewer_app == 'true' || needs.changes.outputs.workflow == 'true'
        uses: actions/checkout@v4

      - name: pnpm
        if: needs.changes.outputs.viewer_app == 'true' || needs.changes.outputs.workflow == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Node
        if: needs.changes.outputs.viewer_app == 'true' || needs.changes.outputs.workflow == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/viewer/pnpm-lock.yaml

      - name: Install
        if: needs.changes.outputs.viewer_app == 'true' || needs.changes.outputs.workflow == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: needs.changes.outputs.viewer_app == 'true' || needs.changes.outputs.workflow == 'true'
        run: pnpm lint

      - name: Build
        if: needs.changes.outputs.viewer_app == 'true' || needs.changes.outputs.workflow == 'true'
        run: pnpm build

  hub-app:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/hub
    steps:
      - name: Skip (no apps/hub paths)
        if: needs.changes.outputs.hub_app != 'true' && needs.changes.outputs.workflow != 'true'
        run: echo "Skipping hub-app."
        working-directory: .

      - name: Checkout
        if: needs.changes.outputs.hub_app == 'true' || needs.changes.outputs.workflow == 'true'
        uses: actions/checkout@v4

      - name: pnpm
        if: needs.changes.outputs.hub_app == 'true' || needs.changes.outputs.workflow == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Node
        if: needs.changes.outputs.hub_app == 'true' || needs.changes.outputs.workflow == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/hub/pnpm-lock.yaml

      - name: Install
        if: needs.changes.outputs.hub_app == 'true' || needs.changes.outputs.workflow == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: needs.changes.outputs.hub_app == 'true' || needs.changes.outputs.workflow == 'true'
        run: pnpm lint

      - name: Build
        if: needs.changes.outputs.hub_app == 'true' || needs.changes.outputs.workflow == 'true'
        run: pnpm build

  website:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: Skip (no website paths)
        if: needs.changes.outputs.website != 'true' && needs.changes.outputs.workflow != 'true'
        run: echo "Skipping website."
        working-directory: .

      - name: Checkout
        if: needs.changes.outputs.website == 'true' || needs.changes.outputs.workflow == 'true'
        uses: actions/checkout@v4

      - name: pnpm
        if: needs.changes.outputs.website == 'true' || needs.changes.outputs.workflow == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Node
        if: needs.changes.outputs.website == 'true' || needs.changes.outputs.workflow == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install
        if: needs.changes.outputs.website == 'true' || needs.changes.outputs.workflow == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: needs.changes.outputs.website == 'true' || needs.changes.outputs.workflow == 'true'
        run: pnpm build

  design-tokens:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip (no web-UI paths)
        if: needs.changes.outputs.design_tokens != 'true' && needs.changes.outputs.workflow != 'true'
        run: echo "Skipping design-tokens."

      - name: Checkout
        if: needs.changes.outputs.design_tokens == 'true' || needs.changes.outputs.workflow == 'true'
        uses: actions/checkout@v4

      - name: Check design tokens
        if: needs.changes.outputs.design_tokens == 'true' || needs.changes.outputs.workflow == 'true'
        run: python3 scripts/check_design_tokens.py
