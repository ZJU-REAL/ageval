name: Feature / change
description: New capability, behavior change, or design-alignment request
title: "feat: "
labels: ["type:feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is this for
      description: Background and problem statement (user or developer scenario).
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested implementation
      description: Optional. Summarize the proposed approach (bullets, control flow, or pseudocode) and link any docs/design pages to update.
      placeholder: |
        Related: docs/design/…
        Related Issue / docs/design links:
    validations:
      required: false

  - type: dropdown
    id: design_impact
    attributes:
      label: Does this change product or mechanism semantics?
      options:
        - No (implementation / docs / examples)
        - Yes (update docs/design when completing the change)
        - Unsure
    validations:
      required: true

  - type: checkboxes
    id: redlines
    attributes:
      label: Self-check
      options:
        - label: Does not require writing secrets into yaml / lock / evidence
        - label: Does not treat trajectory or harness completed as PASS
