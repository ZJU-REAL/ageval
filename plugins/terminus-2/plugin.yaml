format: ageval.plugin/1
plugin_id: terminus-2
version: 0.1.0
description: Host-side Terminus 2 loop. The model stays on the parent; tmux I/O goes through environment.exec.
slots:
  exclusive:
    - id: executor
      priority: 110
      entry: "terminus2_plugin.factory:Terminus2ExecutorSPI"
  chain:
    - id: trajectory_collect
      priority: 110
      entry: "terminus2_plugin.hooks:trajectory_collect"
inject:
  - service: environment
    capabilities: [exec]
config:
  image_layers: docker/Dockerfile.bake
