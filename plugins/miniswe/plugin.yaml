format: ageval.plugin/1
plugin_id: miniswe
version: 0.1.0
description: Drive mini-swe-agent on the parent host; the Attempt box only runs bash through environment.exec. Not ACP.
host_requires:
  - import: minisweagent
    hint: "uv tool install 'ageval-cli[miniswe]' (repo checkout: uv sync --extra miniswe)"
slots:
  exclusive:
    - id: executor
      priority: 110
      entry: "miniswe_plugin.factory:MinisweExecutorSPI"
  chain:
    - id: trajectory_collect
      priority: 110
      entry: "miniswe_plugin.hooks:trajectory_collect"
inject:
  - service: environment
    capabilities: [exec]
config:
  image_layers: docker/Dockerfile.bake
