format: ageval.plugin/1
plugin_id: dsh
version: 0.1.0
description: "Run [DeepSeek Harness](https://github.com/deepseek-ai/deepseek-harness) over JSON-RPC inside the box. Not ACP; credentials stay locators until invoke."
host_requires:
  - import: deepseek_harness
    hint: "uv tool install 'ageval-cli[dsh]' (repo checkout: uv sync --extra dsh)"
  - file: compositions/slim.cordis.yml
slots:
  exclusive:
    - id: executor
      priority: 110
      entry: "dsh_plugin.factory:DshExecutorSPI"
  chain:
    - id: trajectory_collect
      priority: 110
      entry: "dsh_plugin.hooks:trajectory_collect"
inject:
  - service: environment
    capabilities: [exec, upload]
config:
  image_layers: docker/Dockerfile.bake
